<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio 6</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>
    <form action="#" method="post">
        <fieldset>
            <legend>Informazioni Personali</legend>
                <label for="nome">Nome:</label>
                    <input type="text" id="nome" required placeholder="Diana">
                <label for="cognome">Cognome:</label>
                    <input type="text" id="cognome" required placeholder="Poli">
                <label for="email">Email:</label>
                    <input type="email" id="email" required placeholder="diana.poli@example.com">
                <label for="data">Data di nascita:</label>
                    <input type="date" id="data" required>  
                <label for="sesso">Sesso:</label>
                    <select id="sesso" required>
                        <option value="">Seleziona</option>
                        <option value="femmina">Femmina</option>
                        <option value="maschio">Maschio</option>
                        <option value="altro">Altro</option>
                        <option value="preferisco_non_specificare">Preferisco non specificare</option>
                    </select>
                <label for="telefono">Telefono:</label>
                    <input type="tel" id="telefono" required placeholder="+39 123 456 7890">
                <label for="indirizzo">Indirizzo:</label>
                    <input type="text" id="indirizzo" required placeholder="Via Roma, 1">
        </fieldset>

        <fieldset>
            <legend>Informazioni di Accesso</legend>
                <label for="Nome_Utente">Nome Utente:</label>
                    <input type="text" id="Nome_Utente" required placeholder="dianapoli1234">
                <label for="Parola_D'Ordine">Parola d'Ordine:</label>
                    <input type="password" id="Parola_D'Ordine" required placeholder="Inserisci la tua parola d'ordine">
                <label for="Conferma_Parola_D'Ordine">Conferma Parola d'Ordine:</label>
                    <input type="password" id="Conferma_Parola_D'Ordine" required placeholder="Conferma la tua parola d'ordine">
        </fieldset>

        <field
    </form>
</body>
</html>
