<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esercizio 2</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fb 0%, #eaf2ff 100%);
      color: #1f2a37;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .panel {
      width: min(700px, 90vw);
      background: rgba(255,255,255,0.9);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(31, 42, 55, 0.15);
      padding: 2.5rem;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #dfeeff;
      color: #0c5ecb;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    h1 {
      margin-top: 1rem;
      font-size: clamp(2rem, 4vw, 3rem);
    }
    p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #425066;
    }
    a {
      display: inline-block;
      margin-top: 1rem;
      text-decoration: none;
      background: #1f6feb;
      color: white;
      padding: 0.85rem 1.4rem;
      border-radius: 10px;
      font-weight: 600;
      transition: transform 0.2s ease;
    }
    a:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="panel">
    <span class="badge">Esercizio 2</span>
    <h1>In costruzione</h1>
    <p>
      Questa pagina è dedicata al secondo esercizio e sarà completata con i contenuti
      richiesti dal progetto. Per ora puoi tornare alla pagina principale per vedere
      gli esercizi disponibili.
    </p>
    <a href="../index.html">Torna agli esercizi</a>
  </main>
</body>
</html>
