<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modulo di Registrazione</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eaf2ff, #f8fbff);
      color: #1f2937;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #1d4ed8;
    }

    form {
      display: grid;
      gap: 20px;
    }

    fieldset {
      border: 1px solid #dbe3f3;
      border-radius: 12px;
      padding: 20px;
      background: #f9fbff;
    }

    legend {
      font-weight: bold;
      color: #1d4ed8;
      padding: 0 10px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfd8ea;
      border-radius: 8px;
      font-size: 1rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid rgba(29, 78, 216, 0.18);
      border-color: #1d4ed8;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .inline {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .option-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .option-line input {
      width: auto;
      margin: 0;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .actions button {
      width: auto;
      min-width: 140px;
      cursor: pointer;
      font-weight: 700;
    }

    .submit {
      background: #1d4ed8;
      border: none;
      color: white;
    }

    .reset {
      background: #e8eefb;
      border: none;
      color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Modulo di Registrazione</h1>

    <form action="#" method="post">
      <fieldset>
        <legend>Dati Personali</legend>

        <div class="row">
          <div>
            <label for="fname">Nome</label>
            <input type="text" id="fname" name="fname" placeholder="Matteo" required>
          </div>

          <div>
            <label for="lname">Cognome</label>
            <input type="text" id="lname" name="lname" placeholder="Conte" required>
          </div>
        </div>

        <div class="row" style="margin-top: 16px;">
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div>
            <label for="pw">Password</label>
            <input type="password" id="pw" name="pw" minlength="8" required>
          </div>
        </div>

        <div style="margin-top: 16px;">
          <label for="date">Data di Nascita</label>
          <input type="date" id="date" name="date" required>
        </div>
      </fieldset>

      <fieldset>
        <legend>Profilo Tecnico</legend>

        <label for="rp">Ruolo Principale</label>
        <select id="rp" name="ruolo">
          <option value="">Seleziona</option>
          <option value="Frontend">Frontend</option>
          <option value="Backend">Backend</option>
          <option value="UI/UX">UI/UX</option>
          <option value="Data Science">Data Science</option>
        </select>

        <div style="margin-top: 16px;">
          <label>Livello di Esperienza</label>
          <div class="inline">
            <div class="option-line">
              <input type="radio" id="junior" name="esperienza" value="Junior" required>
              <label for="junior">Junior</label>
            </div>
            <div class="option-line">
              <input type="radio" id="mid" name="esperienza" value="Mid">
              <label for="mid">Mid</label>
            </div>
            <div class="option-line">
              <input type="radio" id="senior" name="esperienza" value="Senior">
              <label for="senior">Senior</label>
            </div>
          </div>
        </div>

        <div style="margin-top: 16px;">
          <label>Competenze</label>
          <div class="inline">
            <div class="option-line">
              <input type="checkbox" id="html" name="competenze" value="HTML">
              <label for="html">HTML</label>
            </div>
            <div class="option-line">
              <input type="checkbox" id="css" name="competenze" value="CSS">
              <label for="css">CSS</label>
            </div>
            <div class="option-line">
              <input type="checkbox" id="javascript" name="competenze" value="JavaScript">
              <label for="javascript">JavaScript</label>
            </div>
            <div class="option-line">
              <input type="checkbox" id="python" name="competenze" value="Python">
              <label for="python">Python</label>
            </div>
            <div class="option-line">
              <input type="checkbox" id="sql" name="competenze" value="SQL">
              <label for="sql">SQL</label>
            </div>
          </div>
        </div>

        <div style="margin-top: 16px;">
          <label for="cv">Allegato CV</label>
          <input type="file" id="cv" name="cv" accept=".pdf,application/pdf">
        </div>

        <div style="margin-top: 16px;">
          <label for="bio">Note/Bio</label>
          <textarea id="bio" name="bio" maxlength="300" placeholder="Breve presentazione"></textarea>
        </div>
      </fieldset>

      <fieldset>
        <legend>Conferma e Privacy</legend>

        <div class="option-line">
          <input type="checkbox" id="reg" name="regolamento" required>
          <label for="reg">Accetto il regolamento</label>
        </div>

        <div class="actions" style="margin-top: 16px;">
          <button class="submit" type="submit">Invio</button>
          <button class="reset" type="reset">Reset</button>
        </div>
      </fieldset>
    </form>
  </div>
</body>
</html>
